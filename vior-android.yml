name: Build Vior APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # lets you trigger manually from GitHub UI

jobs:
  build-vior:
    name: Build Vior Debug + Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17 (required for AGP 8+)
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android SDK
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cache Gradle for faster builds
      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Make gradlew executable
      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 6. Inject API keys from GitHub Secrets into local.properties
      - name: 🔐 Inject secrets
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> local.properties
          echo "VIOO_BACKEND_URL=${{ secrets.VIOO_BACKEND_URL }}" >> local.properties

      # 7. Run lint (non-blocking)
      - name: 🧹 Run lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      # 8. Build Debug APK
      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. Build Release APK (unsigned if no keystore)
      - name: 🏗️ Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      # 10. Upload Debug APK as artifact
      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vior-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 11. Upload Release APK (if built)
      - name: 📦 Upload Release APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: vior-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      # 12. Create GitHub Release on tag push
      - name: 🎉 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
